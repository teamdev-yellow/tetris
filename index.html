<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>テトリス</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body>
    <div id="main-menu">
      <h1 class="tetris-title" data-text="Tetris">Tetris</h1>
      <button id="start-btn">PLAY</button>
    </div>

    <div id="game-screen" class="hide">
      <div id="score-container">
        <h2 id="score-title">SCORE</h2>
        <h2 id="score"></h2>
      </div>
      <div id="game-container">
        <div id="level-container">
          <h3>Level</h3>
          <div id="level"></div>
        </div>
        <div id="playground"></div>
        <div id="next-blocks-section">
          <div id="next-blocks-container">
            <p>Next</p>
            <div class="next-block"></div>
            <div class="next-block"></div>
            <div class="next-block"></div>
            <div class="next-block"></div>
            <div class="next-block"></div>
          </div>
          <div id="home-icon">
            <i class="fa-solid fa-house"></i>
          </div>
        </div>
      </div>
    </div>

    <div id="game-over" class="hide">
      <h2>Game Over!</h2>
      <div class="score-box">
        Score:
        <div id="final-score"></div>
      </div>
      <div class="level-box">
        Level:
        <div id="final-level"></div>
      </div>
      <button id="replay-btn">Replay</button>
      <button id="quit-btn">Quit</button>
    </div>
    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
